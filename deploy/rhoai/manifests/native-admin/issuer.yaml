apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: occ-public-http01
  namespace: ${TLS_NAMESPACE}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: occ-public-http01-account
    solvers:
      - http01:
          ingress:
            ingressClassName: openshift-default
