# OpenShift test-cluster profile for the pinned OpenShell v0.1.8 chart.
# The plaintext, unauthenticated gateway is for isolated single-tenant clusters.
# Its NetworkPolicy boundary matches namespace and pod labels, and labels are not
# an authentication boundary: a user who can set them can reach the gateway.
# Use the openshell-mtls overlay (allowUnauthenticatedUsers: false, mTLS) on any
# cluster with users beyond the OCE control plane.
fullnameOverride: openshell-gateway
server:
  disableTls: true
  auth:
    allowUnauthenticatedUsers: true
  drivers:
    kubernetes:
      allowDriverConfig: true
      resourceAdmission:
        enabled: false
      workspaceMode: operator
      operatorNamespaceLabel: openshell.ai/openclaw-workspace=true
# OpenShell 0.1.5 rejects Sandbox template labels unless the operator allows them.
# Images: Red Hat Konflux builds of the v0.1.8-rhaiv.2 midstream release
# (opendatahub-io/openshell, commit 9412bcf7), published on quay.io/opendatahub.
# The sandbox digest is the commit-tagged build, not the later odh-stable tag,
# so all three images come from the same release commit.
gatewayConfig:
  openshell.drivers.kubernetes:
    allowed_pod_labels:
      - openclaw.dev/*
      - app.kubernetes.io/name
      - app.kubernetes.io/managed-by
serviceAccount:
  name: openshell-gateway
sandboxServiceAccount:
  name: openshell-sandbox
workspaceResources:
  enabled: false
podSecurityContext:
  fsGroup: null
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsUser: null
service:
  type: ClusterIP
gateway:
  image:
    registry: quay.io
    repository: opendatahub/odh-openshell-gateway
    digest: sha256:8f1b5b4e00d7338856f6c9dafc7a5470af70c062a917ad55d6a757e36abd855c
sandboxRuntime:
  image:
    registry: quay.io
    repository: opendatahub/odh-openshell-sandbox
    digest: sha256:685e0fe9f82a497a2692655895f569044d1707d9c249abe9979f9dbe81b4a77b
supervisor:
  image:
    registry: quay.io
    repository: opendatahub/odh-openshell-supervisor
    digest: sha256:26aabf98eebaf2e64ec386bf013d25dc8439f51c52b01fa1a2d1dd1e911cb991
