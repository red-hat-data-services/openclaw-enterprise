# OpenShift test-cluster profile for the pinned OpenShell v0.1.10 chart.
# The plaintext, unauthenticated gateway is for isolated single-tenant clusters.
# Its NetworkPolicy boundary matches namespace and pod labels, and labels are not
# an authentication boundary: a user who can set them can reach the gateway.
# Use the openshell-mtls overlay (allowUnauthenticatedUsers: false, mTLS) on any
# cluster with users beyond the OCE control plane.
fullnameOverride: openshell-gateway
server:
  disableTls: true
  auth:
    allowUnauthenticatedUsers: true
  drivers:
    kubernetes:
      allowDriverConfig: true
      resourceAdmission:
        enabled: false
      workspaceMode: operator
      operatorNamespaceLabel: openshell.ai/openclaw-workspace=true
# OpenShell 0.1.5 rejects Sandbox template labels unless the operator allows them.
# Images: Red Hat Konflux builds of the v0.1.10-rhaiv.0 midstream release
# (opendatahub-io/openshell), published on quay.io/opendatahub.
gatewayConfig:
  openshell.drivers.kubernetes:
    allowed_pod_labels:
      - openclaw.dev/*
      - app.kubernetes.io/name
      - app.kubernetes.io/managed-by
serviceAccount:
  name: openshell-gateway
sandboxServiceAccount:
  name: openshell-sandbox
workspaceResources:
  enabled: false
podSecurityContext:
  fsGroup: null
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsUser: null
service:
  type: ClusterIP
gateway:
  image:
    registry: quay.io
    repository: opendatahub/odh-openshell-gateway
    digest: sha256:e4b89770ef55238cc45d9880614eda64b8ab9a76be5e6c81c63a350889eb0717
sandboxRuntime:
  image:
    registry: quay.io
    repository: opendatahub/odh-openshell-sandbox
    digest: sha256:365d321345ea142a10d442f91bebeaf6d67dac4384b6dc29b4e72ada01a9b959
supervisor:
  image:
    registry: quay.io
    repository: opendatahub/odh-openshell-supervisor
    digest: sha256:c2c8e9d3d19a1612074df0f637078064cff45b92d35c74b116a72fb503b3c1bc
