# The labels transformer keeps selectors byte-identical to the base. Do not
# replace it with commonLabels: that injects the label into every
# NetworkPolicy podSelector and namespaceSelector, and the Pods those
# selectors target are created outside this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/operators
labels:
  - includeSelectors: false
    includeTemplates: false
    pairs:
      oce-ocp-setup/environment: stage
