apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eg-nonroot-v2
  namespace: envoy-gateway-system
rules:
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    resourceNames: [nonroot-v2]
    verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eg-certgen-nonroot
  namespace: envoy-gateway-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eg-nonroot-v2
subjects:
  - kind: ServiceAccount
    name: eg-gateway-helm-certgen
    namespace: envoy-gateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eg-controller-nonroot
  namespace: envoy-gateway-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eg-nonroot-v2
subjects:
  - kind: ServiceAccount
    name: envoy-gateway
    namespace: envoy-gateway-system
