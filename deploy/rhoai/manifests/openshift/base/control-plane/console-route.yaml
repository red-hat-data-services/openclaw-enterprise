# Set the cluster-domain host; edge TLS uses the default ingress certificate.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openclaw-enterprise-console
  namespace: openclaw-system
  annotations:
    # Streaming agent chat can stay silent longer than the router's 30-second
    # default server timeout. Upstream requires at least 660 seconds per
    # request (docs/guides/agent-http-chat.md).
    haproxy.router.openshift.io/timeout: 660s
spec:
  host: console.oce.example.invalid
  to:
    kind: Service
    name: openclaw-enterprise-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
