# Set the cluster-domain host; edge TLS uses the default ingress certificate.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openclaw-enterprise-console
  namespace: openclaw-system
spec:
  host: console.oce.example.invalid
  to:
    kind: Service
    name: openclaw-enterprise-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
