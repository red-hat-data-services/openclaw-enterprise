# Replace this documentation-only CIDR and port with the cluster's translated
# kubernetes.default.svc endpoint before applying.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oce-kube-api-egress
  namespace: openclaw-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise
      app.kubernetes.io/instance: oce
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, worker, upgrade-preflight]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.20/32
      ports:
        - protocol: TCP
          port: 6443
