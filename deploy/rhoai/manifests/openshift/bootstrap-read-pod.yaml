apiVersion: v1
kind: Pod
metadata:
  name: occ-bootstrap-read
  namespace: openclaw-system
spec:
  serviceAccountName: openclaw-enterprise-initialization
  restartPolicy: Never
  nodeSelector:
    oce-role: control
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reader
      image: registry.example.invalid/openclaw-enterprise/controller@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      command: ["/bin/sh", "-c", "sleep 300"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
  volumes:
    - name: bootstrap
      persistentVolumeClaim:
        claimName: occ-bootstrap-admin-password
        readOnly: true
