backend:
  - id: openshell
    type: openshell
    configuration:
      endpoint: http://openshell-gateway.openshell-system.svc.cluster.local:8080
      insecureTransport: network-policy
    drivers:
      sandbox: openshell-sandbox
drivers:
  compute:
    configuration:
      servicePrincipalCredentials:
        mode: disabled
      network:
        providerHarness:
          namespace: openshell-system
          podLabels:
            app.kubernetes.io/name: openshell
            app.kubernetes.io/instance: openshell-gateway
          # Replace with the discovered OpenShell gateway Service ClusterIP.
          address: 192.0.2.10
          port: 8080
  sandbox:
    id: openshell-sandbox
    configuration:
      gateway:
        operatorNamespaceLabels:
          openshell.ai/openclaw-workspace: "true"
        operatorWorkspaceResources: []
        networkPolicyResources:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-openshell-sandbox-callback
            spec:
              podSelector:
                matchLabels:
                  openshell.ai/managed-by: openshell
                  openshell.ai/boundary-role: supervisor
              policyTypes: [Egress]
              egress:
                - to:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: openshell-system
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: openshell
                          app.kubernetes.io/instance: openshell-gateway
                  ports:
                    - protocol: TCP
                      port: 8080
      kubernetes:
        serviceAccount:
          mode: gatewayConfigured
        sandboxDataMount:
          subPath: workspace
          mountPath: /sandbox/enterprise
          readOnly: false
      policy:
        process:
          runAsUser: "1000"
          runAsGroup: "1000"
        networkPolicies:
          - name: source-control
            endpoints:
              - host: github.com
                ports: [443]
                protocol: tcp
                tls: skip
              # gh resolves API operations (gh api, pr, repo clone) against this host.
              - host: api.github.com
                ports: [443]
                protocol: tcp
                tls: skip
            # The runtime image is Debian-based: git HTTP helpers live under /usr/lib/git-core.
            binaries:
              - path: /usr/bin/git
              - path: /usr/local/bin/gh
              - path: /usr/lib/git-core/git-remote-http
              - path: /usr/lib/git-core/git-remote-https
      sandboxNamePrefix: os
  token_service:
    id: occ
    configuration: {}
# Delegates the Agent-side model-egress addition the agents flow saves per Agent.
# The bundled Codex executable is architecture-specific; add the aarch64 path on arm64.
sandboxNetworkPolicyCeiling:
  - id: codex-model-egress
    binary: /app/node_modules/openclaw/node_modules/.pnpm/@openai+codex@0.164.0-linux-x64/node_modules/@openai/codex/vendor/x86_64-unknown-linux-musl/bin/codex
    host: api.openai.com
    ports:
      - from: 443
        to: 443
