apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: oce-image-builds
parameters:
  - name: REV
    required: true
  - name: RUNTIME_TAG
    description: Runtime tag identifying both OCE and OpenClaw source revisions.
    required: true
  - name: NODE_BASE_IMAGE
    value: docker.io/library/node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
  - name: OPENCLAW_COMMIT
    required: true
  - name: OPENCLAW_SOURCE_SHA256
    required: true
  - name: OPENCLAW_BUILD_TIMESTAMP
    required: true
objects:
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: oce-controller
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: oce-runtime
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: oce-controller
    spec:
      source:
        type: Binary
        binary: {}
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: Dockerfile
          buildArgs:
            - name: NODE_BASE_IMAGE
              value: ${NODE_BASE_IMAGE}
            - name: OCC_BUILD_REVISION
              value: ${REV}
      output:
        to:
          kind: ImageStreamTag
          name: oce-controller:${REV}
        imageLabels:
          - name: org.opencontainers.image.revision
            value: ${REV}
      triggers: []
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: oce-runtime
    spec:
      source:
        type: Binary
        binary: {}
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: deploy/runtime/Dockerfile
          buildArgs:
            - name: OPENCLAW_COMMIT
              value: ${OPENCLAW_COMMIT}
            - name: OPENCLAW_SOURCE_SHA256
              value: ${OPENCLAW_SOURCE_SHA256}
            - name: OPENCLAW_BUILD_TIMESTAMP
              value: ${OPENCLAW_BUILD_TIMESTAMP}
            - name: NODE_BASE_IMAGE
              value: ${NODE_BASE_IMAGE}
            - name: OCC_BUILD_REVISION
              value: ${REV}
      output:
        to:
          kind: ImageStreamTag
          name: oce-runtime:${RUNTIME_TAG}
        imageLabels:
          - name: org.opencontainers.image.revision
            value: ${REV}
      triggers: []
