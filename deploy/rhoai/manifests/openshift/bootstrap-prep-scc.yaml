# Grant only while preparing the fresh OCC bootstrap PVC, then remove the grant.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: oce-bootstrap-volume-prep
priority: 10
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: [CHOWN, FOWNER]
defaultAddCapabilities: []
requiredDropCapabilities: []
readOnlyRootFilesystem: true
seccompProfiles: [runtime/default]
runAsUser:
  type: MustRunAs
  uid: 0
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes: [persistentVolumeClaim]
users: []
groups: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oce-bootstrap-volume-prep
  namespace: openclaw-system
rules:
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    resourceNames: [oce-bootstrap-volume-prep]
    verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oce-bootstrap-volume-prep
  namespace: openclaw-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oce-bootstrap-volume-prep
subjects:
  - kind: ServiceAccount
    name: default
    namespace: openclaw-system
