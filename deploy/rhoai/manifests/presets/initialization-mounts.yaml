apiVersion: batch/v1
kind: Job
metadata:
  name: oce-initialization
spec:
  template:
    spec:
      volumes:
        - name: installation-startup
          secret:
            items:
              - key: installation.yaml
                path: installation.yaml
              - key: chief-of-staff.json
                path: chief-of-staff.json
              - key: question-and-answer.json
                path: question-and-answer.json
              - key: software-eng-team.json
                path: software-eng-team.json
