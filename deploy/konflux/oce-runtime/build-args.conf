## OpenClaw Enterprise (MIT): this repository is the build context, so it supplies the
## runtime recipe, the OpenClaw bridge patches and the repository-credentials client.
## deploy/konflux/oce_pins.py derives the pins below from deploy/runtime.

# Commit whose deploy/runtime/Dockerfile deploy/docker/Dockerfile.konflux.oce-runtime was last ported from
OCE_REVIEWED_COMMIT=0d9748a4941f0d7116b8fca4dd92c9cb83191104
# Fingerprint of deploy/docker/Dockerfile.konflux.oce-runtime when that port was recorded
OCE_PORT_SHA256=146be7c33b76b5b72f834f9c47ea21fffc318ccebdc8432285f3f90780926682
# openclaw/openclaw-enterprise commit of the latest upstream sync, kept current by
# deploy/konflux/refresh-pins.sh. The build does not read it: it changes this file on
# every sync, which starts the Konflux on-push build.
OCE_UPSTREAM_COMMIT=b99fc6fd25b5e6e45bc3ede7ef35aa4350c4b6c2

## OpenClaw (MIT): unreleased main commit selected by OCE deploy/runtime/openclaw-source.json

